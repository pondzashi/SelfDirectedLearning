<style>
:root {
  --bg: #f6f7fb; --card: #ffffff; --ink: #1f2430; --muted: #667085; --line: #e3e6ee;
  --brand: #4f46e5; --brand-ink: #ffffff; --brand-soft: #eef0ff;
  --green: #16a34a; --green-soft: #e7f6ec; --yellow: #ca8a04; --yellow-soft: #fdf5d8; --red: #dc2626; --red-soft: #fdeaea;
  --none: #98a2b3; --none-soft: #eef0f4; --warn: #f59e0b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141b; --card: #1b1f2a; --ink: #e8eaf0; --muted: #9aa3b5; --line: #2c3242;
    --brand: #818cf8; --brand-ink: #11131a; --brand-soft: #262a45;
    --green: #4ade80; --green-soft: #17301f; --yellow: #facc15; --yellow-soft: #33290c; --red: #f87171; --red-soft: #381a1a;
    --none: #7b8499; --none-soft: #252a37;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Sarabun", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, h2, h3 { line-height: 1.3; margin: 0 0 .5em; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); } .small { font-size: .875rem; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 16px; border-radius: 10px; min-height: 44px; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid transparent; }
.b-green { background: var(--green-soft); color: var(--green); } .b-yellow { background: var(--yellow-soft); color: var(--yellow); }
.b-red { background: var(--red-soft); color: var(--red); } .b-none { background: var(--none-soft); color: var(--none); }
.tag { background: var(--brand-soft); color: var(--brand); }
.hidden { display: none !important; }
.spinner { text-align: center; padding: 48px 0; color: var(--muted); }
pre.text, .text { white-space: pre-wrap; word-wrap: break-word; }
img.fig { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); margin: 8px 0; }
input[type=text], input[type=number], input[type=password], select, textarea {
  font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); max-width: 100%; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 50; max-width: 90vw; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--card); border-radius: 14px; padding: 20px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; }
</style>
